apiVersion: v1
kind: Namespace
metadata:
  name: openshift-monitoring
  labels:
    openshift.io/cluster-monitoring: "true"
---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cluster-monitoring-view
  labels:
    app.kubernetes.io/managed-by: cluster-monitoring-operator
    app.kubernetes.io/part-of: openshift-monitoring
rules:
- apiGroups:
  - ""
  resources:
  - namespaces
  verbs:
  - get
- apiGroups:
  - monitoring.coreos.com
  resources:
  - prometheuses/api
  verbs:
  - get
  - create
  - update
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-k8s
  namespace: openshift-monitoring
  annotations:
    service.beta.openshift.io/serving-cert-secret-name: prometheus-k8s-tls
  labels:
    app.kubernetes.io/name: prometheus-k8s
spec:
  ports:
  - name: web
    port: 9091
    targetPort: 9091
  selector:
    app.kubernetes.io/name: prometheus-k8s
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-k8s-config
  namespace: openshift-monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      evaluation_interval: 5s
    scrape_configs:
    - job_name: "prometheus"
      static_configs:
      - targets: ["localhost:9091"]
      scheme: HTTPS
      tls_config:
        insecure_skip_verify: true
  web-config.yml: |
    tls_server_config:
      cert_file: /etc/tls/private/tls.crt
      key_file: /etc/tls/private/tls.key
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus-k8s
  namespace: openshift-monitoring
  labels:
    app.kubernetes.io/name: prometheus-k8s
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus-k8s
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prometheus-k8s
    spec:
      containers:
      - name: prometheus
        image: quay.io/prometheus/prometheus:v2.53.0
        imagePullPolicy: IfNotPresent
        command:
        - /bin/prometheus
        args:
        - --config.file=/etc/prometheus/prometheus.yml
        - --web.config.file=/etc/prometheus/web-config.yml
        - --web.listen-address=0.0.0.0:9091
        - --storage.tsdb.path=/prometheus
        ports:
        - containerPort: 9091
          name: web
        volumeMounts:
        - name: config
          mountPath: /etc/prometheus
        - name: tls
          mountPath: /etc/tls/private
          readOnly: true
        - name: data
          mountPath: /prometheus
      volumes:
      - name: config
        configMap:
          name: prometheus-k8s-config
      - name: tls
        secret:
          secretName: prometheus-k8s-tls
      - name: data
        emptyDir: {}
