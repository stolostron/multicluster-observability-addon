{{- range $component, $label := dict "workloadRightSizing" "right-sizing-workload" "podRightSizing" "right-sizing-pod" }}
{{- if and $.Values.rightSizing (index $.Values.rightSizing $component) (index (index $.Values.rightSizing $component) "enabled") }}
{{- range $_, $rule := (index (index $.Values.rightSizing $component) "rules") }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ $rule.name }}
  namespace: openshift-monitoring
  labels:
    {{- $mcoaHelmLabels := fromYaml (include "mcoahelm.labels" $) }}
    {{- $customLabel := dict "app.kubernetes.io/component" $label }}
    {{- $mergedLabels := mergeOverwrite $mcoaHelmLabels $customLabel }}
    {{- toYaml $mergedLabels | nindent 4 }}
  annotations:
    operator.prometheus.io/controller-id: "openshift-monitoring/prometheus-operator"
spec:
{{ fromJson $rule.data | toYaml | nindent 2 }}
---
{{- end }}
{{- end }}
{{- end }}
