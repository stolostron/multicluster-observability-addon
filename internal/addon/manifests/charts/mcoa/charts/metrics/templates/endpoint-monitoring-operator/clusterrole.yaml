apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "mcoa.globalResourcePrefix" "endpoint-monitoring-operator" }}
  labels:
    app.kubernetes.io/component: endpoint-monitoring-operator
    {{- include "metricshelm.labels" . | nindent 4 }}
rules:
# Allows updating/patching only the two specific platform configmaps
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "watch", "update", "patch", "create"]
  resourceNames: ["cluster-monitoring-config"]
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "watch", "update", "patch", "create"]
  resourceNames: ["user-workload-monitoring-config"]
# Namespace-wide "create" needed to initialize them if they don't exist yet
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "watch", "create"]
# warning events for overwritten/mutated configs
- apiGroups: ["events.k8s.io"]
  resources: ["events"]
  verbs: ["create", "patch"]
- apiGroups: ["config.openshift.io"]
  resources: ["apiservers"]
  verbs: ["get", "list", "watch"]
# Read permissions for ScrapeConfigs and PrometheusAgents to list/watch target endpoints
- apiGroups: ["monitoring.rhobs"]
  resources: ["scrapeconfigs", "prometheusagents"]
  verbs: ["get", "list", "watch"]
# COO detection: endpoint operator creates and updates two ClusterClaims.
# list/watch are needed for the controller-runtime cache informer.
- apiGroups: ["cluster.open-cluster-management.io"]
  resources: ["clusterclaims"]
  verbs: ["create", "list", "watch"]
- apiGroups: ["cluster.open-cluster-management.io"]
  resources: ["clusterclaims"]
  verbs: ["get", "update"]
  resourceNames: ["coo-installed.observability.open-cluster-management.io", "coo-managed-by.observability.open-cluster-management.io"]
# OLM Subscription detection for COO status reporting
- apiGroups: ["operators.coreos.com"]
  resources: ["subscriptions"]
  verbs: ["list", "watch"]
# CRD management (applied directly on spoke, not via ManifestWork) and TLS profile management
- apiGroups: ["apiextensions.k8s.io"]
  resources: ["customresourcedefinitions"]
  verbs: ["get", "list", "watch", "create", "update", "patch"]
