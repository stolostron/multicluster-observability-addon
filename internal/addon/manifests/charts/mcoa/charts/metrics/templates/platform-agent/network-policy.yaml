{{- if .Values.global.networkPoliciesEnabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Values.platform.appName }}
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: {{ .Values.platform.component }}
      app.kubernetes.io/part-of: multicluster-observability-addon
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports: 
        - port: 9092 # metrics
          protocol: TCP   
        - port: 9091 # federate metrics
          protocol: TCP
  egress: # allow all egress
    - {}
{{- end }}