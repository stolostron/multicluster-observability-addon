{{- if .Values.thanosOperator.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Values.thanosOperator.appName }}-manager-rolebinding
  labels:
    app.kubernetes.io/component: {{ .Values.thanosOperator.component }}
    app.kubernetes.io/name: {{ .Values.thanosOperator.appName }}
    {{ include "metricshelm.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Values.thanosOperator.appName }}-manager-role
subjects:
- kind: ServiceAccount
  # The operator runs in the observability namespace (see the serviceAccount
  # and deployment templates); the chart is rendered on the hub with
  # .Release.Namespace = open-cluster-management-agent-addon, so the subject
  # namespace must not follow the release namespace.
  name: {{ .Values.thanosOperator.appName }}-controller-manager
  namespace: open-cluster-management-observability
{{- end }}