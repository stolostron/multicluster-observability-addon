{{- if .Values.enabled }}
kind: Deployment
apiVersion: apps/v1
metadata:
  name: mcoa-observability-observatorium-api
  namespace: open-cluster-management-observability
  labels:
    app: {{ template "mcoagatewayhelm.name" . }}
    chart: {{ template "mcoagatewayhelm.chart" . }}
    release: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/component: mcoa-api
      app.kubernetes.io/instance: mcoa-observability
      app.kubernetes.io/name: mcoa-observatorium-api
      app.kubernetes.io/part-of: mcoa-observatorium
  template:
    metadata:
      labels:
        app.kubernetes.io/component: mcoa-api
        app.kubernetes.io/instance: mcoa-observability
        app.kubernetes.io/name: mcoa-observatorium-api
        app.kubernetes.io/part-of: mcoa-observatorium
    spec:
      restartPolicy: Always
      serviceAccountName: observability-observatorium-api
      imagePullSecrets:
        - name: multiclusterhub-operator-pull-secret
      schedulerName: default-scheduler
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 30
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: In
                      values:
                        - mcoa-observatorium-api
                    - key: app.kubernetes.io/instance
                      operator: In
                      values:
                        - mcoa-observability
                topologyKey: kubernetes.io/hostname
            - weight: 70
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: In
                      values:
                        - mcoa-observatorium-api
                    - key: app.kubernetes.io/instance
                      operator: In
                      values:
                        - mcoa-observability
                topologyKey: topology.kubernetes.io/zone
      terminationGracePeriodSeconds: 30
      securityContext: {}
      containers:
        - resources:
            requests:
              cpu: {{ .Values.resources.cpuRequest }}
              memory: {{ .Values.resources.memoryRequest }}
          readinessProbe:
            httpGet:
              path: /ready
              port: 8081
              scheme: HTTP
            timeoutSeconds: 1
            periodSeconds: 5
            successThreshold: 1
            failureThreshold: 12
          terminationMessagePath: /dev/termination-log
          name: observatorium-api
          livenessProbe:
            httpGet:
              path: /live
              port: 8081
              scheme: HTTP
            timeoutSeconds: 1
            periodSeconds: 30
            successThreshold: 1
            failureThreshold: 10
          securityContext:
            privileged: false
            readOnlyRootFilesystem: true
          ports:
            - name: internal
              containerPort: 8081
              protocol: TCP
            - name: public
              containerPort: 8080
              protocol: TCP
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - name: tenants
              readOnly: true
              mountPath: /etc/observatorium/tenants.yaml
              subPath: tenants.yaml
            # Mounted as a whole secret rather than with subPath: subPath
            # mounts are snapshotted at pod start and never updated, so the
            # kubelet would not surface the reissued certificate that adds the
            # Route host to the SANs and --tls.reload-interval would be a no-op.
            - name: tls-secret
              readOnly: true
              mountPath: /var/run/tls
            {{- if .Values.logsEnabled }}
            - name: loki-client-tls
              readOnly: true
              mountPath: /var/run/loki-client-tls/tls.crt
              subPath: tls.crt
            - name: loki-client-tls
              readOnly: true
              mountPath: /var/run/loki-client-tls/tls.key
              subPath: tls.key
            {{- end }}
            {{- if .Values.alertmanagerEndpoints }}
            - name: alertmanager-accessor
              readOnly: true
              mountPath: /var/run/alertmanager-accessor
            {{- end }}
            - name: openshift-service-ca
              readOnly: true
              mountPath: /var/run/openshift-service-ca/service-ca.crt
              subPath: service-ca.crt
          terminationMessagePolicy: File
          image: 'quay.io/rh-ee-dbuchana/mcoa-gateway:add-alert-fanout-2026-10-27-v0.1.2-728-g20439a0' # TODO replace stolostron image when we get one
          args:
            - '--web.listen=0.0.0.0:8080'
            - '--web.internal.listen=0.0.0.0:8081'
            - '--metrics.read.endpoint={{ .Values.metricsReadEndpoint }}'
            - '--metrics.write.endpoint={{ .Values.metricsWriteEndpoint }}'
            - '--log.level=debug'
            - '--tenants.config=/etc/observatorium/tenants.yaml'
            - '--web.healthchecks.url=https://127.0.0.1:8080'
            - '--tls.client-auth-type=RequireAndVerifyClientCert'
            - '--tls.server.cert-file=/var/run/tls/tls.crt'
            - '--tls.server.key-file=/var/run/tls/tls.key'
            - '--tls.client-ca-file=/var/run/tls/ca.crt'
            - '--tls.reload-interval=1m'
            - '--tls.healthchecks.server-ca-file=/var/run/tls/ca.crt'
            - '--tls.healthchecks.server-name=mcoa-observability-observatorium-api.open-cluster-management-observability.svc'
            - '--tls.healthchecks.client-cert-file=/var/run/tls/tls.crt'
            - '--tls.healthchecks.client-key-file=/var/run/tls/tls.key'
            - '--metrics.write-timeout=5m'
            - '--server.read-header-timeout=10s'
            {{- if .Values.logsEnabled }}
            - '--logs.write.endpoint={{ .Values.logsWriteEndpoint }}'
            - '--logs.read.endpoint={{ .Values.logsReadEndpoint }}'
            - '--logs.tls.cert-file=/var/run/loki-client-tls/tls.crt'
            - '--logs.tls.key-file=/var/run/loki-client-tls/tls.key'
            - '--logs.tls.ca-file=/var/run/openshift-service-ca/service-ca.crt'
            {{- end }}
            {{- range .Values.alertmanagerEndpoints }}
            - '--alertmanager.endpoint={{ . }}'
            {{- end }}
            - '--alertmanager.upstream-server-name=alertmanager.open-cluster-management-observability.svc'
            - '--alertmanager.upstream-ca-file=/var/run/openshift-service-ca/service-ca.crt'
            - '--alertmanager.accessor-token-file=/var/run/alertmanager-accessor/token'
      serviceAccount: observability-observatorium-api
      volumes:
        - name: tenants
          secret:
            secretName: observability-observatorium-api
            defaultMode: 420
        - name: tls-secret
          secret:
            secretName: mcoa-gateway-server-tls
            defaultMode: 420
        {{- if .Values.logsEnabled }}
        - name: loki-client-tls
          secret:
            secretName: mcoa-gateway-loki-client-tls
            defaultMode: 420
        {{- end }}
        - name: openshift-service-ca
          configMap:
            name: openshift-service-ca.crt
            defaultMode: 420
            items:
              - key: service-ca.crt
                path: service-ca.crt
        - name: alertmanager-accessor
          secret:
            secretName: observability-alertmanager-accessor
            defaultMode: 420
      dnsPolicy: ClusterFirst
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  revisionHistoryLimit: 10
  progressDeadlineSeconds: 600
{{- end }}
