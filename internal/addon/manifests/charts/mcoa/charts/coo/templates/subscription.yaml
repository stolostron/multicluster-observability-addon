{{- if and .Values.enabled .Values.installCOO }}
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: cluster-observability-operator
  namespace: openshift-cluster-observability-operator
  labels:
    operators.coreos.com/cluster-observability-operator.openshift-cluster-observability: ''
    app: {{ template "coohelm.name" . }}
    chart: {{ template "coohelm.chart" . }}
    release: {{ .Release.Name }}
spec:
  channel: stable
  installPlanApproval: Automatic
  name: cluster-observability-operator
  source: {{ .Values.catalogSource | default "redhat-operators" }}
  sourceNamespace: {{ .Values.catalogSourceNamespace | default "openshift-marketplace" }}
{{- end }}
