{{- if and .Values.enabled .Values.monitoringUIPlugin (not .Values.isHub) }}
apiVersion: observability.openshift.io/v1alpha1
kind: UIPlugin
metadata:
  name: monitoring
  labels:
    app: {{ template "coohelm.name" . }}
    chart: {{ template "coohelm.chart" . }}
    release: {{ .Release.Name }}
spec:
  monitoring:
{{- if and .Values.incidentDetection .Values.incidentDetection.enabled }}
    incidents:
      enabled: true
{{- end }}
  type: Monitoring
{{- end }}
