{{- if and .Values.enabled .Values.installCLO }}
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: cluster-logging
  namespace: openshift-logging
  labels:
    operators.coreos.com/cluster-logging.openshift-logging: ''
    app: {{ template "logginghelm.name" . }}
    chart: {{ template "logginghelm.chart" . }}
    release: {{ .Release.Name }}
spec:
  channel: {{ .Values.openshiftLoggingChannel }}
  installPlanApproval: Automatic
  name: cluster-logging
  source: {{ .Values.catalogSource | default "redhat-operators" }}
  sourceNamespace: {{ .Values.catalogSourceNamespace | default "openshift-marketplace" }}
{{- end }}
