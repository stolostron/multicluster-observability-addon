evaluation_interval: 1m
tests:
  - name: pod ownership and duplicate scrape handling
    interval: 1m
    input_series:
      - series: 'kube_pod_info{namespace="openshift-test",pod="bare",instance="a"}'
        values: '1'
      - series: 'kube_pod_info{namespace="openshift-test",pod="bare",instance="b"}'
        values: '1'
      - series: 'kube_pod_info{namespace="test",pod="static"}'
        values: '1'
      - series: 'kube_pod_info{namespace="test",pod="catalog"}'
        values: '1'
      - series: 'kube_pod_info{namespace="test",pod="installer"}'
        values: '1'
      - series: 'kube_pod_owner{namespace="test",pod="static",owner_kind="Node",owner_name="node1"}'
        values: '1'
      - series: 'kube_pod_owner{namespace="test",pod="catalog",owner_kind="CatalogSource",owner_name="catalog1"}'
        values: '1'
      - series: 'kube_pod_owner{namespace="test",pod="installer",owner_kind="ConfigMap",owner_name="config1"}'
        values: '1'
      - series: 'kube_pod_info{namespace="test",pod="deployment-pod"}'
        values: '1'
      - series: 'kube_pod_owner{namespace="test",pod="deployment-pod",owner_kind="ReplicaSet",owner_name="app-rs"}'
        values: '1'
      - series: 'kube_replicaset_owner{namespace="test",replicaset="app-rs",owner_kind="Deployment",owner_name="app"}'
        values: '1'
      - series: 'kube_pod_owner{namespace="test",pod="rs-pod",owner_kind="ReplicaSet",owner_name="bare-rs"}'
        values: '1'
      - series: 'kube_pod_owner{namespace="test",pod="cron-pod",owner_kind="Job",owner_name="cron-job"}'
        values: '1'
      - series: 'kube_job_owner{namespace="test",job_name="cron-job",owner_kind="CronJob",owner_name="cron"}'
        values: '1'
      - series: 'kube_pod_owner{namespace="test",pod="job-pod",owner_kind="Job",owner_name="job"}'
        values: '1'
      - series: 'kube_pod_owner{namespace="test",pod="ds-pod",owner_kind="DaemonSet",owner_name="ds",instance="a"}'
        values: '1'
      - series: 'kube_pod_owner{namespace="test",pod="ds-pod",owner_kind="DaemonSet",owner_name="ds",instance="b"}'
        values: '1'
      - series: 'kube_pod_owner{namespace="test",pod="sts-pod",owner_kind="StatefulSet",owner_name="sts"}'
        values: '1'
      - series: 'kube_pod_owner{namespace="test",pod="rc-pod",owner_kind="ReplicationController",owner_name="rc"}'
        values: '1'
    promql_expr_test:
      # The Go test injects the actual query generated by podWorkloadRelabelExpr.
      - expr: POD_WORKLOAD_MAPPING_EXPRESSION
        eval_time: 0m
        exp_samples:
          - labels: '{namespace="openshift-test",pod="bare"}'
            value: 1
          - labels: '{namespace="test",pod="static"}'
            value: 1
          - labels: '{namespace="test",pod="catalog"}'
            value: 1
          - labels: '{namespace="test",pod="installer"}'
            value: 1
          - labels: '{namespace="test",pod="deployment-pod",workload="app",workload_type="Deployment"}'
            value: 1
          - labels: '{namespace="test",pod="rs-pod",workload="bare-rs",workload_type="ReplicaSet"}'
            value: 1
          - labels: '{namespace="test",pod="cron-pod",workload="cron",workload_type="CronJob"}'
            value: 1
          - labels: '{namespace="test",pod="job-pod",workload="job",workload_type="Job"}'
            value: 1
          - labels: '{namespace="test",pod="ds-pod",workload="ds",workload_type="DaemonSet"}'
            value: 1
          - labels: '{namespace="test",pod="sts-pod",workload="sts",workload_type="StatefulSet"}'
            value: 1
          - labels: '{namespace="test",pod="rc-pod",workload="rc",workload_type="ReplicationController"}'
            value: 1
