apiVersion: v1
kind: Service
metadata:
  name: multicluster-observability-addon-manager-metrics
  labels:
    app: multicluster-observability-addon-manager
  annotations:
    service.beta.openshift.io/serving-cert-secret-name: multicluster-observability-addon-manager-metrics-certs
spec:
  ports:
    - name: https-metrics
      port: 8444
      targetPort: https-metrics
      protocol: TCP
  selector:
    app: multicluster-observability-addon-manager
  type: ClusterIP
